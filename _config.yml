title: Fabric Property Assessment Hackathon
description: Hands-on Microsoft Fabric analytics and AI challenge
url: https://nicktinmicrosoft.github.io
baseurl: /fabric-hackathon-attendee-accessor
theme: minima
markdown: kramdown
plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
access_api_url: ""
repository_url: https://github.com/nickTinMicrosoft/fabric-hackathon-attendee-accessor
defaults:
  - scope:
      path: ""
    values:
      layout: page
relative_links:
  enabled: true
  collections: true

# Keep generated outputs out of the published site.
exclude:
  - .gitignore
  - .vscode/
  - pdf/
  - Videos/
  - old_versions/
  - Documents/old_versions/
  - api/
  - tests/
  - node_modules/
  - package.json
  - package-lock.json
  - playwright.config.js
  - Gemfile
  - Gemfile.lock
  - LICENSE
